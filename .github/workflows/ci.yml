# Provides CI evidence; merge enforcement is documented in POLICY.md.
name: Fixture CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  revision-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Record tested merge revision
        env:
          TESTED_SHA: ${{ github.sha }}
        run: printf 'LINA_CHECK_TESTED_SHA=%s\n' "$TESTED_SHA"
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node --test total.test.js
  ci-gate:
    if: always()
    needs: [acceptance, revision-proof]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required result
        env:
          RESULT: ${{ needs.acceptance.result }}
          REVISION_RESULT: ${{ needs.revision-proof.result }}
        run: test "$RESULT" = success && test "$REVISION_RESULT" = success
