# LINA Check — trusted workflow template (observe only).
#
# Copy to .github/workflows/lina-check.yml in the AUTHORIZED SYNTHETIC repository
# only. See docs/workflows/README.md for what must be resolved before first use;
# this file is a template under docs/ and is deliberately not an active workflow
# in this repository.
name: LINA Check

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Review or maintain repository instructions
        type: choice
        options: [review, guidance]
        default: review
      guidance_request:
        description: Guidance JSON with candidateSha, event, registryPath and verifierId
        type: string
        required: false
        default: ""
      subject_kind:
        description: Review a pull request or an issue
        type: choice
        options: [pr, issue]
        default: pr
        required: false
      subject_number:
        description: Pull request or issue number (review only)
        type: string
        required: false
      engine_sha:
        description: Private engine commit (40 hex) to execute
        type: string
        required: true
      policy_commit:
        description: Trusted policy commit (review only; must equal PR base SHA)
        type: string
        required: false
      publish:
        description: Post results to the subject. Leave false to observe only.
        type: boolean
        default: false
      verification_evidence_file:
        description: Optional signed verification JSON in the pinned private engine checkout
        type: string
        required: false
        default: ""
      verification_evidence_commit:
        description: Optional 40-hex private engine commit for the signed verification JSON; defaults to engine_sha
        type: string
        required: false
        default: ""

# Least privilege at the workflow level; the review job widens only what the
# controller needs to collect and publish in this repository.
permissions:
  contents: read

# One run per subject. Never cancel in flight: a cancelled run can leave a
# claimed publication intent behind.
concurrency:
  group: lina-check-${{ github.repository }}-${{ inputs.operation == 'guidance' && 'guidance' || format('{0}-{1}', inputs.subject_kind, inputs.subject_number) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  review:
    name: ${{ inputs.operation == 'guidance' && 'Guidance maintenance' || 'Review' }}
    # Any runner with Docker and the network reach to fetch the pinned runtime.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The target repository token is the publishing identity: GitHub Actions is
    # an App installation, which is what the Checks API requires. Only the
    # controller process receives it; the sandbox launcher builds the model
    # container environment from an allowlist holding the model key alone, so
    # this token never reaches the container.
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      checks: write
    # Repository and ref guard. workflow_dispatch can select any ref, so a
    # non-default branch must not accidentally run this workflow. This guard
    # assumes trusted writers: someone allowed to change workflow files can
    # remove it. Actor permissions remain part of the trust boundary.
    if: >-
      github.repository == vars.LINA_AUTHORIZED_REPOSITORY &&
      (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        (vars.LINA_WORKFLOW_REF != '' && github.ref == format('refs/heads/{0}', vars.LINA_WORKFLOW_REF))
      )
    steps:
      - name: Validate dispatch inputs and actor
        env:
          ALLOWED_ACTORS: ${{ vars.LINA_ALLOWED_ACTORS }}
          ACTOR: ${{ github.triggering_actor }}
          SUBJECT_NUMBER: ${{ inputs.subject_number }}
          OPERATION: ${{ inputs.operation }}
          ENGINE_SHA: ${{ inputs.engine_sha }}
          POLICY_COMMIT: ${{ inputs.policy_commit }}
        run: |
          set -euo pipefail
          export LINA_RUN_ROOT="$RUNNER_TEMP/lina-check"
          export LINA_PRIVATE_LOG="$LINA_RUN_ROOT/private/engine.log"
          printf '%s\n' "LINA_RUN_ROOT=$LINA_RUN_ROOT" "LINA_PRIVATE_LOG=$LINA_PRIVATE_LOG" >> "$GITHUB_ENV"
          # Every value below reaches a command line or a checkout, so each is
          # shape-checked before any credential is loaded.
          [[ "${OPERATION:-review}" == review || "$OPERATION" == guidance ]] || { echo 'Invalid operation'; exit 1; }
          if [[ "${OPERATION:-review}" == review ]]; then
            [[ "$SUBJECT_NUMBER" =~ ^[0-9]{1,9}$ ]] || { echo 'Invalid subject number'; exit 1; }
            [[ "$POLICY_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'policy_commit must be a full 40-hex commit'; exit 1; }
          fi
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'engine_sha must be a full 40-hex commit'; exit 1; }
          [[ -n "${ALLOWED_ACTORS:-}" ]] || { echo 'Set the LINA_ALLOWED_ACTORS variable first'; exit 1; }
          match=0
          for allowed in ${ALLOWED_ACTORS//,/ }; do
            [[ "${allowed,,}" == "${ACTOR,,}" ]] && match=1
          done
          [[ "$match" == 1 ]] || { echo 'Actor not authorized'; exit 1; }
          mkdir -p "$LINA_RUN_ROOT/private"
          chmod 700 "$LINA_RUN_ROOT" "$LINA_RUN_ROOT/private"

      - name: Check out the public subject repository
        env:
          OPERATION: ${{ inputs.operation }}
          GUIDANCE_REQUEST: ${{ inputs.guidance_request }}
          SUBJECT_REPOSITORY: ${{ github.repository }}
          SUBJECT_KIND: ${{ inputs.subject_kind }}
          SUBJECT_NUMBER: ${{ inputs.subject_number }}
        # Cloned without any credential: the subject is public and the engine
        # reads it only as Git objects.
        run: |
          set -euo pipefail
          # Dispatch values reach the shell through the environment only, never
          # through expression interpolation inside a command line.
          git clone --quiet --filter=blob:none "https://github.com/${SUBJECT_REPOSITORY}.git" "$LINA_RUN_ROOT/subject"
          cd "$LINA_RUN_ROOT/subject"
          # Reviewed content must never execute as part of this checkout. Hooks
          # are not cloned, but the hooks path is pinned away regardless.
          git config core.hooksPath /dev/null
          if [[ "${OPERATION:-review}" == guidance ]]; then
            candidate="$(node -e 'try { const r=JSON.parse(process.env.GUIDANCE_REQUEST); if (!/^[a-f0-9]{40}$/.test(r.candidateSha)) process.exit(1); process.stdout.write(r.candidateSha); } catch { process.exit(1); }')" || { echo 'Invalid guidance candidate'; exit 1; }
            git fetch --quiet --no-tags origin "$candidate"
            git checkout --quiet --detach "$candidate"
          elif [[ "$SUBJECT_KIND" == 'pr' ]]; then
            # Named local refs, never FETCH_HEAD: a second fetch overwrites it.
            # The controller needs the PR head and its base objects present.
            git fetch --quiet --no-tags origin \
              "+refs/pull/${SUBJECT_NUMBER}/head:refs/lina-check/pr-head" \
              "+refs/heads/*:refs/remotes/origin/*"
            git checkout --quiet --detach refs/lina-check/pr-head
            git rev-parse HEAD >/dev/null
          fi

      # Pinned to the commit `git ls-remote` resolved for tag v6. Nothing later
      # in this job compensates for an unpinned action: it runs before every
      # check below and with access to this job's environment.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      # Compatibility guard, not a security control.
      - name: Assert the runtime satisfies the engine
        run: |
          set -euo pipefail
          major="$(node -p 'process.versions.node.split(".")[0]')"
          # This project runs the engine on Node 24.
          [[ "$major" -ge 24 ]] || { echo "Node 24+ required, found $major"; exit 1; }
          docker version --format '{{.Server.Version}}' >/dev/null

      - name: Fetch the private engine at the pinned commit
        env:
          ENGINE_DEPLOY_KEY: ${{ secrets.LINA_ENGINE_DEPLOY_KEY }}
          ENGINE_REPOSITORY: ${{ vars.LINA_ENGINE_REPOSITORY }}
          ENGINE_SHA: ${{ inputs.engine_sha }}
          SSH_KNOWN_HOSTS: ${{ vars.LINA_SSH_KNOWN_HOSTS }}
          VERIFICATION_EVIDENCE_FILE: ${{ inputs.verification_evidence_file }}
          VERIFICATION_EVIDENCE_COMMIT: ${{ inputs.verification_evidence_commit }}
        run: |
          set -euo pipefail
          [[ -n "${ENGINE_DEPLOY_KEY:-}" && -n "${ENGINE_REPOSITORY:-}" ]] || { echo 'Engine deploy key or repository is not configured'; exit 1; }
          # A pinned host key is required: trust-on-first-use would accept
          # whatever answers the first connection.
          [[ -n "${SSH_KNOWN_HOSTS:-}" ]] || { echo 'LINA_SSH_KNOWN_HOSTS is not configured; record the published SSH host keys first'; exit 1; }
          key="$LINA_RUN_ROOT/private/engine_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$ENGINE_DEPLOY_KEY" > "$key"
          known="$LINA_RUN_ROOT/private/known_hosts"
          install -m 600 /dev/null "$known"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known"
          # Read-only deploy key, private engine, immutable commit. Engine clone
          # output is private: a failure must not print repository contents.
          git clone --quiet "git@github.com:${ENGINE_REPOSITORY}.git" "$LINA_RUN_ROOT/engine-src" >>"$LINA_PRIVATE_LOG" 2>&1
          cd "$LINA_RUN_ROOT/engine-src"
          git checkout --quiet "$ENGINE_SHA" >>"$LINA_PRIVATE_LOG" 2>&1
          [[ "$(git rev-parse HEAD)" == "$ENGINE_SHA" ]] || { echo 'Engine checkout is not the pinned commit'; exit 1; }
          if [[ -n "${VERIFICATION_EVIDENCE_COMMIT:-}" && "$VERIFICATION_EVIDENCE_COMMIT" != "$ENGINE_SHA" ]]; then
            [[ "$VERIFICATION_EVIDENCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'verification_evidence_commit must be a full 40-hex commit'; exit 1; }
            [[ -n "${VERIFICATION_EVIDENCE_FILE:-}" ]] || { echo 'verification_evidence_file is required with verification_evidence_commit'; exit 1; }
            [[ "$VERIFICATION_EVIDENCE_FILE" != /* && "$VERIFICATION_EVIDENCE_FILE" != *..* ]] || { echo 'Invalid verification file'; exit 1; }
            git fetch --quiet origin "$VERIFICATION_EVIDENCE_COMMIT" >>"$LINA_PRIVATE_LOG" 2>&1 || { echo 'Verification evidence commit was not available'; exit 1; }
            [[ "$(git rev-parse --verify "$VERIFICATION_EVIDENCE_COMMIT^{commit}")" == "$VERIFICATION_EVIDENCE_COMMIT" ]] || { echo 'Verification evidence commit was not available'; exit 1; }
            install -m 600 /dev/null "$LINA_RUN_ROOT/private/evidence.json"
            git show "$VERIFICATION_EVIDENCE_COMMIT:$VERIFICATION_EVIDENCE_FILE" >"$LINA_RUN_ROOT/private/evidence.json" 2>>"$LINA_PRIVATE_LOG" || { echo 'Verification evidence was not available'; exit 1; }
            size="$(wc -c < "$LINA_RUN_ROOT/private/evidence.json")"
            [[ "$size" -gt 0 && "$size" -le 16777216 ]] || { echo 'Invalid verification file'; exit 1; }
          fi
          rm -f "$key"
          unset GIT_SSH_COMMAND

      - name: Install engine dependencies
        run: |
          set -euo pipefail
          cd "$LINA_RUN_ROOT/engine-src/engine"
          # --ignore-scripts: install must not execute package lifecycle code.
          npm ci --ignore-scripts >>"$LINA_PRIVATE_LOG" 2>&1 || { echo 'Engine dependency install failed; see private log'; exit 1; }

      - name: Stage the pinned Cursor runtime
        env:
          CURSOR_RUNTIME_DIR: ${{ vars.LINA_CURSOR_RUNTIME_DIR }}
        run: |
          set -euo pipefail
          cd "$LINA_RUN_ROOT/engine-src/engine"
          if [[ -n "${CURSOR_RUNTIME_DIR:-}" ]]; then
            # Pre-staged runtime on a self-hosted runner stays supported.
            [[ -d "$CURSOR_RUNTIME_DIR" ]] || { echo 'Configured Cursor runtime directory does not exist on this runner'; exit 1; }
            echo "LINA_STAGED_RUNTIME=$CURSOR_RUNTIME_DIR" >> "$GITHUB_ENV"
          else
            # Otherwise acquire it from the URL pinned in
            # deploy/lina-check/runtime-lock.json. The script verifies the archive
            # hash before extracting and then accepts only the exact locked
            # inventory. Its output names the staged directory; the download
            # itself stays out of the public log.
            staged="$(node --import tsx scripts/fetch-lina-runtime.ts "$LINA_RUN_ROOT/private/runtime" 2>>"$LINA_PRIVATE_LOG" | node -pe 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).staged')" || { echo 'Pinned runtime acquisition failed; see private log'; exit 1; }
            [[ -d "$staged" ]] || { echo 'Pinned runtime acquisition produced no staged directory'; exit 1; }
            echo "LINA_STAGED_RUNTIME=$staged" >> "$GITHUB_ENV"
          fi

      - name: Build the sandbox images
        run: |
          set -euo pipefail
          cd "$LINA_RUN_ROOT/engine-src/engine"
          # Hashes every file against the lock, then builds from the digest-pinned
          # base image. Build output stays private.
          node --import tsx scripts/build-lina-sandbox.ts "$LINA_STAGED_RUNTIME" >>"$LINA_PRIVATE_LOG" 2>&1 || { echo 'Sandbox build failed; see private log'; exit 1; }

      - name: Compose trusted controller options
        if: inputs.operation != 'guidance'
        env:
          OPTIONS_PATH: ${{ runner.temp }}/lina-check/private/options.json
          SUBJECT_REPOSITORY: ${{ github.repository }}
          SUBJECT_WORKSPACE: ${{ runner.temp }}/lina-check/subject
          STATE_DIRECTORY: ${{ runner.temp }}/lina-check/private/state
          SUBJECT_KIND: ${{ inputs.subject_kind }}
          SUBJECT_NUMBER: ${{ inputs.subject_number }}
          ENGINE_SHA: ${{ inputs.engine_sha }}
          POLICY_COMMIT: ${{ inputs.policy_commit }}
          PUBLISH: ${{ inputs.publish }}
          ACTOR: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ALLOWED_ACTORS: ${{ vars.LINA_ALLOWED_ACTORS }}
          STATE_REPOSITORY: ${{ vars.LINA_STATE_REPOSITORY }}
          STATE_BRANCH: ${{ vars.LINA_STATE_BRANCH }}
          STATE_PATH: ${{ vars.LINA_STATE_PATH }}
          PROVIDER_HOSTS: ${{ vars.LINA_PROVIDER_HOSTS }}
          POLICY_PATH: ${{ vars.LINA_POLICY_PATH }}
          VERIFICATION_EVIDENCE_FILE: ${{ inputs.verification_evidence_file }}
          VERIFICATION_EVIDENCE_COMMIT: ${{ inputs.verification_evidence_commit }}
        run: |
          set -euo pipefail
          [[ -n "${STATE_REPOSITORY:-}" && "$STATE_REPOSITORY" == */* ]] || { echo 'Set LINA_STATE_REPOSITORY to owner/repo'; exit 1; }
          [[ -n "${PROVIDER_HOSTS:-}" ]] || { echo 'Set LINA_PROVIDER_HOSTS to the model egress allowlist'; exit 1; }
          mkdir -p "$STATE_DIRECTORY" && chmod 700 "$STATE_DIRECTORY"
          # src/lina-check/sandbox.ts accepts only /^sha256:[a-f0-9]{64}$/ for both
          # images, so the mutable build tags are resolved to image digests here.
          CURSOR_IMAGE="$(docker image inspect --format '{{.Id}}' lina-check-cursor:qualification)"
          PROXY_IMAGE="$(docker image inspect --format '{{.Id}}' lina-check-proxy:qualification)"
          for digest in "$CURSOR_IMAGE" "$PROXY_IMAGE"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Sandbox image did not resolve to a digest'; exit 1; }
          done
          export CURSOR_IMAGE PROXY_IMAGE
          # Written with node so the exact option keys the controller validates are
          # produced verbatim; the file is private and never uploaded.
          install -m 600 /dev/null "$LINA_RUN_ROOT/private/options.json"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const env = process.env;
            const list = (value) => String(value).split(",").map((item) => item.trim()).filter(Boolean);
            let verification = {};
            if (env.VERIFICATION_EVIDENCE_FILE) {
              const staged = path.resolve(env.LINA_RUN_ROOT, "private/evidence.json");
              const file = env.VERIFICATION_EVIDENCE_COMMIT && env.VERIFICATION_EVIDENCE_COMMIT !== env.ENGINE_SHA
                ? staged
                : (() => {
                    const root = fs.realpathSync(path.resolve(env.LINA_RUN_ROOT, "engine-src"));
                    const resolved = fs.realpathSync(path.resolve(root, env.VERIFICATION_EVIDENCE_FILE));
                    if (!resolved.startsWith(root + path.sep) || fs.statSync(resolved).size > 16 * 1024 * 1024) throw Error("Invalid verification file");
                    return resolved;
                  })();
              if (fs.statSync(file).size > 16 * 1024 * 1024) throw Error("Invalid verification file");
              const evidence = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!Array.isArray(evidence)) throw Error("Expected verification evidence array");
              verification = { verificationEvidence: evidence };
            }
            fs.writeFileSync(env.OPTIONS_PATH, JSON.stringify({
              ...verification,
              access: {
                repo: env.SUBJECT_REPOSITORY,
                actor: env.ACTOR,
                allowedActors: list(env.ALLOWED_ACTORS),
              },
              kind: env.SUBJECT_KIND,
              number: Number(env.SUBJECT_NUMBER),
              workspace: env.SUBJECT_WORKSPACE,
              stateDirectory: env.STATE_DIRECTORY,
              policyPath: env.POLICY_PATH || ".lina-check/policy.json",
              trustedPolicyCommit: env.POLICY_COMMIT,
              runId: Number(env.RUN_ID),
              runAttempt: Number(env.RUN_ATTEMPT),
              engineRevision: env.ENGINE_SHA,
              stateLocation: {
                owner: env.STATE_REPOSITORY.split("/")[0],
                repo: env.STATE_REPOSITORY.split("/")[1],
                branch: env.STATE_BRANCH || "lina-check-state",
                path: env.STATE_PATH || "state/state.sqlite",
              },
              cursorImage: env.CURSOR_IMAGE,
              proxyImage: env.PROXY_IMAGE,
              providerHosts: list(env.PROVIDER_HOSTS),
              publish: env.PUBLISH === "true",
              timeoutMs: 90 * 60 * 1000,
            }));
          ' >>"$LINA_PRIVATE_LOG" 2>&1 || { echo 'Controller options preparation failed'; exit 1; }

      - name: Run the controller
        if: inputs.operation != 'guidance'
        env:
          # Review collection and publication use this repository's Actions token,
          # scoped by the job permissions above. Credentials stay in this step
          # and none of them is mounted into the model sandbox.
          LINA_GITHUB_TOKEN: ${{ github.token }}
          LINA_STATE_GITHUB_TOKEN: ${{ secrets.LINA_STATE_TOKEN }}
          LINA_VERIFIER_PRIVATE_KEY: ${{ secrets.LINA_VERIFIER_PRIVATE_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          cd "$LINA_RUN_ROOT/engine-src/engine"
          install -m 600 /dev/null "$LINA_RUN_ROOT/private/result.json"
          # The CLI prints only {status, verdict, published} on stdout and a fixed
          # token on stderr, so this is the one engine output safe for public logs.
          set +e
          node --import tsx scripts/lina-check-controller.ts \
            "$LINA_RUN_ROOT/private/options.json" \
            "$LINA_RUN_ROOT/private/result.json" \
            2>>"$LINA_PRIVATE_LOG"
          status=$?
          set -e
          [[ "$status" == 0 ]] || { echo 'Controller finished incomplete or holding'; exit "$status"; }

      - name: Run registered guidance maintenance
        if: inputs.operation == 'guidance'
        env:
          # Same account identity for every guidance CLI and private-state call.
          # Job permissions constrain github.token, not this explicitly authorized PAT.
          LINA_GITHUB_TOKEN: ${{ secrets.LINA_STATE_TOKEN }}
          LINA_GUIDANCE_VERIFIER_PRIVATE_KEY: ${{ secrets.LINA_GUIDANCE_VERIFIER_PRIVATE_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          LINA_GUIDANCE_REQUEST: ${{ inputs.guidance_request }}
          LINA_GUIDANCE_PUBLISH: ${{ inputs.publish }}
          LINA_GUIDANCE_WORKSPACE: ${{ runner.temp }}/lina-check/subject
        run: |
          set -euo pipefail
          cd "$LINA_RUN_ROOT/engine-src/engine"
          export LINA_CURSOR_IMAGE="$(docker image inspect --format '{{.Id}}' lina-check-cursor:qualification)"
          export LINA_PROXY_IMAGE="$(docker image inspect --format '{{.Id}}' lina-check-proxy:qualification)"
          node --import tsx scripts/lina-check-guidance-dispatch.ts 2>>"$LINA_PRIVATE_LOG"

      - name: Remove run-owned private material
        if: always()
        run: |
          set -euo pipefail
          # Nothing here is ever uploaded as an artifact; this only shortens the
          # window on a self-hosted runner whose disk outlives the job.
          find "$LINA_RUN_ROOT/private" -type f -exec shred -u {} + 2>/dev/null || true
          if [[ -n "${LINA_GUIDANCE_ROOT:-}" && "$LINA_GUIDANCE_ROOT" == "$HOME"/.lina-guidance-* ]]; then
            find "$LINA_GUIDANCE_ROOT" -type f -exec shred -u {} + 2>/dev/null || true
          fi
