name: Private engine on public runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.actor == 'thisisjun786'
    runs-on: ubuntu-latest
    steps:
      - name: Verify private source requires authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/thisisjun786/pr-agent-opencodex-smoke-20260908/contents/pricing.py > /dev/null 2>&1; then
            echo 'Unexpected cross-repository access'; exit 1
          fi
          echo 'Public repository token cannot read private source: PASS'
      - name: Fetch pinned private code with read-only deploy key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: thisisjun786/pr-agent-opencodex-smoke-20260908
          ref: 3e5741beac48c5daba08806ffc2e46e36c69cab7
          ssh-key: ${{ secrets.PRIVATE_ENGINE_SSH_KEY }}
          persist-credentials: false
          path: private-engine
      - name: Execute private module and verify credential removal
        working-directory: private-engine
        run: |
          test "$(git rev-parse HEAD)" = 3e5741beac48c5daba08806ffc2e46e36c69cab7
          if git config --local --get core.sshCommand > /dev/null; then exit 1; fi
          python3 -c 'from pricing import discounted_total; assert discounted_total(10000,20)==8000; print("Private module execution: PASS")'
          python3 -m unittest -q
          echo 'Private engine fetched and executed; credentials not persisted; no source artifact uploaded' >> "$GITHUB_STEP_SUMMARY"
